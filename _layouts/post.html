---
layout: default
---
<div class="container layout layout--wide">
  <main id="main" class="content post">
    <p class="post-back"><a href="{{ '/notes/' | relative_url }}">← All notes</a></p>
    <span class="pub-tag">{{ page.category | default: 'writing' }}</span>
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time> · {{ site.author.name }}</p>
    {%- if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
    <div class="post-content">
      {{ content }}
    </div>
  </main>
</div>
