- title: >-
    Comparison of cationic dyes (Basic Orange 2, Basic Yellow 2 and Basic Violet 3) removal from aqueous solution using clay as an adsorbent
  citation: >-
    Farizoğlu, B., Fil, B. A., Sözüdoğru, O., <strong>Aladag, E.</strong>, &amp; Kul, S. (2019). Comparison of cationic dyes (Basic Orange 2, Basic Yellow 2 and Basic Violet 3) removal from aqueous solution using clay as an adsorbent. <em>Fresenius Environmental Bulletin</em>, 28(5), 3658–3666.
  year: 2019
  type: sci
  index: SCI-E
  url: https://www.prt-parlar.de/download_feb_2019/
  pdf: feb_2019.pdf
  abstract: >-
    <p>The present work aims to investigate the removal of three cationic dyes (Basic Orange 2, Basic Yellow 2 and Basic Violet 3) from aqueous solutions by montmorillonite under various experimental conditions. Cationic dyes were selected Basic Orange 2 (BO2), Basic Yellow 2 (BY2) and Basic Violet 3 (BV3). The effects of pH, initial dye concentration, adsorbent dose, agitation speed and ionic strength, on the removal of dyes were studied. According to the experiments results, it was shown, that maximum removal was achieved in less than 45 min. The results indicate that the montmorillonite can be used as a low cost alternative according to other adsorbents in the removal of dyes from wastewater. The maximum adsorption efficiency levels attained were as follows: 95.849% BO2, 99.562% BY2 and 99.169% BV3 onto montmorillonite at pH: 5.0, 100 mg/L initial dye concentration, 0.75 g/L clay dosage, 300 rpm agitation speed, 0 M NaCl ionic strength and 293 K, reaction time of 45 min. </p>
- title: Investigation of biodegradation and growth kinetics of dairy wastewater in a batch reactor
  citation: >-
    Bayram, T. T., Nuhoğlu, A., &amp; <strong>Aladag, E.</strong> (2017). Investigation of biodegradation and growth kinetics of dairy wastewater in a batch reactor. <em>Bulgarian Chemical Communications</em>, 49(4), 896–900.
  year: 2017
  type: sci
  index: SCI-E
  url: >-
    https://www.researchgate.net/profile/Guelsah-Caliskan-Koc/publication/323144765_Mathematical_Modeling_on_Thin_Layer_Microwave_Drying_of_Corn_Husk_and_Investigation_of_Powder_Properties/links/5b9f4616299bf13e6037cc86/Mathematical-Modeling-on-Thin-Layer-Microwave-Drying-of-Corn-Husk-and-Investigation-of-Powder-Properties.pdf#page=138
  pdf: bcc_2017.pdf
  abstract: >-
    <p>In this study, biodegradation of dairy wastewater was investigated under aerobic conditions in a batch reactor. A minimum concentration of 100 mg L<sup>-1</sup> and a maximum concentration of 1000 mg L<sup>-1</sup> of COD in the wastewater were used. The culture substrate removal kinetics was followed and the specific growth rate was fitted to the Monod model. The kinetic coefficients KS and μmax were found to be 46.55 mg L<sup>-1</sup> and 0.0344 h<sup>-1</sup>, respectively. The regression coefficient was 0.99. The compatibility of actual and predicted results of microbial growth and substrate removal was compared with this model. Results indicated that predicted and actual values fitted each other with 89% compatibility. </p>
- title: >-
    Adsorptive removal of cationic (BY2) dye from aqueous solutions onto Turkish clay: Isotherm, kinetic, and thermodynamic analysis
  citation: >-
    Sözüdoğru, O., Fil, B. A., Boncukcuoğlu, R., <strong>Aladag, E.</strong>, &amp; Kul, S. (2016). Adsorptive removal of cationic (BY2) dye from aqueous solutions onto Turkish clay: Isotherm, kinetic, and thermodynamic analysis. <em>Particulate Science and Technology</em>, 34(1), 103–111.
  year: 2016
  type: sci
  index: SCI-E
  url: https://doi.org/10.1080/02726351.2015.1052121
  pdf: 02726351.2015.1052121.pdf
  abstract: >-
    <p>The removal of Basic Yellow 2 (BY2), a cationic dye, from aqueous solution by using montmorillonite as adsorbent was studied in batch experiments. The effect of pH, agitation speed, adsorbent dosage, initial dye concentration ionic strength, and temperature on the removal of BY2 was also investigated. Langmuir, Freundlich, Temkin, and Dubinin–Radushkevich isotherms were applied to fit the adsorption data of BY2 dye. Equilibrium data were well described by the typical Langmuir adsorption isotherm. The maximum monolayer adsorption capacity was calculated as 434.196 mg g<sup>-1</sup> from the Langmuir isotherm model. The adsorption data was fitted to both the pseudo-first-order, pseudo-second-order, Elovich, and intraparticle kinetic models, and the calculated values of the amount adsorbed at equilibrium (q<sub>e</sub>) by pseudo-second-order equations were found to be in good agreement with the experimental values. The thermodynamic factors were also evaluated. The entropy change (ΔS*)
    was negative, suggesting that the adsorption process decreases in entropy and enthalpy change (ΔH*) was positive which indicates endothermic nature. The positive ΔG* value confirms the un-spontaneity of the process. In addition, a semiempirical model was calculated from kinetic data. </p>
- title: >-
    Adsorption of methyl violet dye a textile industry effluent onto montmorillonite-batch study
  citation: >-
    <strong>Aladag, E.</strong>, Fil, B. A., Boncukcuoğlu, R., Sözüdoğru, O., &amp; Yılmaz, A. E. (2014). Adsorption of methyl violet dye a textile industry effluent onto montmorillonite-batch study. <em>Journal of Dispersion Science and Technology</em>, 35(12), 1737–1744.
  year: 2014
  type: sci
  index: SCI-E
  url: https://doi.org/10.1080/01932691.2013.873865
  pdf: 01932691.2013.873865.pdf
  abstract: >-
    <p>In this study, methyl violet (MV) dye adsorption from synthetically prepared solutions onto montmorillonite was investigated. Experimental parameters were selected as stirring speed, adsorbent dosage, initial dyestuff concentration, initial solution pH, ionic strength, and temperature. It was determined that adsorption rate increased with increasing stirring speed, initial dye concentration, solution pH, ionic strength, and temperature, but decreased with increased adsorbent dosage. The experimental data were analyzed by Langmuir, Freundlich, Temkin, and Dubinin–Radushkevich isotherms, and it was found that the isotherm data were reasonably correlated by Langmuir isotherm. Maximum adsorption capacity of montmorillonite for MV dye was calculated as 230.04 mg g<sup>-1</sup>. Pseudo-first-order, pseudo-second-order, Elovich, and intraparticle particle diffusion models were used to fit the experimental data. Pseudo-second-order rate equation provided realistic description of adsorption
    kinetics. Thermodynamic parameters were calculated as 62.14 kJ mol<sup>-1</sup>, 59.55 kJ mol<sup>-1</sup>, 51.98 kJ mol<sup>-1</sup>, and 0.0242 kJ mol<sup>-1</sup> K<sup>-1</sup> for E<sub>a</sub>, ΔH*, ΔG*, and ΔS* at 293 K, respectively. The value of the calculated parameters indicated that the physical adsorption of MV on the clay was dominant and the adsorption process was also endothermic. The positive values of ΔS° suggest the increased randomness. The positive ΔG° value indicated the un-spontaneous nature of the adsorption model. </p>
- title: >-
    The nexus between air pollution and the COVID-19 pandemic in Turkey: Further insights from wavelet coherence analysis
  citation: >-
    <strong>Aladag, E.</strong> (2024). The nexus between air pollution and the COVID-19 pandemic in Turkey: Further insights from wavelet coherence analysis. <em>Aerosol Science and Engineering</em>, 8, 108–119.
  year: 2024
  type: other
  index: ESCI
  url: https://doi.org/10.1007/s41810-023-00209-1
  pdf: s41810-023-00209-1.pdf
  abstract: >-
    <p>The nexus of the ambient air quality and the COVID-19 pandemic is a topic that has attracted much attention and remains of current interest. The study area of Turkey is one of the countries with high case numbers, but there is no detailed investigation dealing with it in the literature. For this reason, the correlation and links between COVID-19 cases and deaths in Turkey with the air pollutants of PM<sub>10</sub>, PM<sub>2.5</sub>, SO<sub>2</sub>, CO, NO<sub>2</sub> and O<sub>3</sub> were determined between 1 April and 31 July 2021 using the statistical methods of cross-correlation and wavelet coherence analysis. According to the findings, for the COVID-19 pandemic parameters, there were positive significant correlations with PM<sub>2.5</sub>, SO<sub>2</sub>, CO, and NO<sub>2</sub> and an inverse significant correlation with O<sub>3</sub>. Although the wavelet transform is not convincing to suggest a standalone coherence, it reveals that air pollution and the spread and mortality
    of the pandemic in Turkey have short-term periods of co-movement. Additionally, it is notable that the national air quality improved during full lockdown periods in the country. The findings obtained in this study are expected to attract the attention of legislating and enforcing authorities and support more decisive steps being taken to reduce environmental pollutants and to control air pollution.</p>
