- title: >-
    Prediction of air pollution in Van province using an ARIMA model based on empirical mode decomposition
  citation: >-
    <strong>Aladag, E.</strong> (2023). Prediction of air pollution in Van province using an ARIMA model based on empirical mode decomposition. <em>Yüzüncü Yıl University Journal of the Institute of Natural and Applied Sciences</em>, 28(2), 495–509. (in Turkish)
  year: 2023
  type: other
  index: TR Dizin
  url: https://doi.org/10.53433/yyufbed.1220578
  pdf: yyufbed.1220578.pdf
  abstract: >-
    <p>Air pollution is one of the main factors that directly threatens the quality of life. Predicting changes in air pollutants has an important role in air pollution control and management. Traditional methods such as Double Exponential Smoothing (DES) and Autoregressive Integrated Moving Average (ARIMA) used today are often insufficient for estimating air pollution. Therefore, more effective techniques are needed to determine air quality. The main purpose of this research is to develop a highly accurate air pollution prediction theory by addressing the above problems. The proposed approach is a hybrid method in which Empirical Mode Decomposition (EMD) algorithm and ARIMA model are applied together. To determine the estimation ability of the EMD-ARIMA method, data on PM<sub>10</sub> and SO<sub>2</sub> air pollutants in the city center of Van, Türkiye, in the winter period of 2019-2020 were used. According to MAE, MAPE, RMSE and R<sup>2</sup> performance criteria, values of 7.25 µg/m<sup>3</sup>
    , 20.58%, 8.84 µg/m<sup>3</sup> , 0.87 and 7.58 µg/m<sup>3</sup> , 20.73%, 8.96 µg/m<sup>3</sup> , 0.71 were obtained for PM<sub>10</sub> and SO<sub>2</sub> with EMD-ARIMA model, respectively. The findings reveal that the EMD-ARIMA method has a more sensitive estimation ability than traditional DES and ARIMA estimation models. The proposed hybrid approach can be used as a simple and effective method for predicting and reducing air pollution. </p>
  abstract_tr: >-
    <p>Hava kirliliği, yaşam kalitesini doğrudan tehdit eden ana unsurlardan birisidir. Hava kirleticilerindeki değişimlerin öngörülmesi, hava kirliliği kontrolünde ve yönetiminde önemli bir role sahiptir. Günümüzde kullanılan Çift Üstel Düzeltme (DES) ve Bütünleşik Otoregresif Hareketli Ortalama (ARIMA) gibi geleneksel yöntemler, hava kirliliğinin tahmin edilmesinde çoğu zaman yetersiz kalmaktadır. Bu nedenle, hava kalitesinin belirlenebilmesi için daha etkili tekniklerin üretilmesine ihtiyaç vardır. Bu araştırmanın temel amacı, yukarıdaki sorunları ele alarak doğruluğu yüksek bir hava kirliliği tahmin teorisi geliştirmektir. Önerilen yaklaşım, Ampirik Mod Ayrıştırması (EMD) algoritması ve ARIMA modelinin bir arada uygulandığı melez bir yöntemdir. EMD-ARIMA yönteminin tahmin becerisini belirlemek için Türkiye’nin Van şehir merkezindeki PM<sub>10</sub> ve SO<sub>2</sub> hava kirleticilerine ait 2019-2020 kış dönemindeki veriler kullanılmıştır. MAE, MAPE, RMSE ve R<sup>2</sup> performans
    ölçütlerine göre EMD-ARIMA modeli ile PM<sub>10</sub> ve SO<sub>2</sub> için sırasıyla 7.25 µg/m<sup>3</sup>, %20.58, 8.84 µg/m<sup>3</sup>, 0.87 ve 7.58 µg/m<sup>3</sup>, %20.73, 8.96 µg/m<sup>3</sup>, 0.71 değerleri elde edilmiştir. Bulgular EMD-ARIMA yönteminin, geleneksel DES ve ARIMA tahmin modellerine göre daha hassas bir tahmin becerisine sahip olduğunu ortaya koymaktadır. Önerilen melez yaklaşım, hava kirliliğinin öngörülmesi ve azaltılmasına yönelik basit ve etkili bir yöntem olarak kullanılabilir. </p>
- title: Optimization of nonlinear adsorption isotherm models by error analysis
  citation: >-
    <strong>Aladag, E.</strong> (2023). Optimization of nonlinear adsorption isotherm models by error analysis. <em>Journal of the Institute of Science and Technology (Iğdır University)</em>, 13(1), 200–212. (in Turkish)
  year: 2023
  type: other
  index: TR Dizin
  url: https://doi.org/10.21597/jist.1163166
  pdf: jist.1163166.pdf
  abstract: >-
    <p>In this study, the adsorption of crystal violet dye from aqueous solution onto montmorillonite was studied and the equilibrium isotherms were determined. Two-parameter equations; the Langmuir, Freundlich, and Temkin isotherms, and three-parameter equations; the Sips, Toth, and Khan isotherms were examined for their ability to model the equilibrium adsorption data. Five error analysis methods were used to determine the optimal isotherm: the sum of the errors squared, a hybrid error function, the average relative error, Marquardt's percent standard deviation, and the sum of absolute errors. The Sips isotherm achieved the best-fit quality with the experimental data and the maximum adsorption capacity was found to be 152.229 mg/g. The sum of the normalized errors showed that the hybrid fractional error function obtained the best overall results. </p>
  abstract_tr: >-
    <p>Bu çalışmada, sulu çözeltilerden kristal menekşe boyasının montmorillonit üzerine adsorpsiyonu araştırılmış ve denge izotermleri belirlenmiştir. İki parametreli denklemler Langmuir, Freundlich, Temkin izotermleri ve üç parametreli denklemler Sips, Toth, Khan izotermleri denge adsorpsiyon verilerini modelleme becerileri açısından incelenmiştir. En uygun izotermi belirlemek için hataların karelerinin toplamı, melez bir hata fonksiyonu, ortalama bağıl hata, Marquardt'ın standart sapma yüzdesi ve mutlak hataların toplamı olmak üzere beş hata analiz yöntemi kullanılmıştır. Sips izotermi, deneysel verilerle en iyi uyumu elde etmiştir ve maksimum adsorpsiyon kapasitesi 152.229 mg/g olarak bulunmuştur. Normalleştirilmiş hataların toplamı, melez kesirli hata fonksiyonunun en iyi sonuçları sağladığını göstermiştir. </p>
- title: N-glycosylation profiles of the green microalgae <i>Chlorella zofingiensis</i>
  citation: >-
    Yaman, M. E., <strong>Aladag, E.</strong>, Kayılı, H. M., Kadıoğlu, Y., &amp; Salih, B. (2021). N-glycosylation profiles of the green microalgae Chlorella zofingiensis. <em>Hacettepe Journal of Biology and Chemistry</em>, 49(2), 147–155.
  year: 2021
  type: other
  index: TR Dizin
  url: https://doi.org/10.15671/hjbc.717600
  pdf: hjbc.717600.pdf
  abstract: >-
    <p>Nowadays, the use of microalgae species as raw materials in biopharmaceutical production is on the agenda. The reason behind this idea is that microalgae are cell factories that are able to efficiently utilize carbon dioxide for the production of numerous biologically active compounds. However, there are several problems that remain to be solved in the production of recombinant protein from microalgaes. One of the critical requirements is to produce a bio-compatible N-glycosylation profile from the secreted recombinant proteins. However, the knowledge about the glycosylation machinery and N-glycan profiles of microalgae spices are quite limited. In the study, it was aimed to characterize N-glycan profiles of a green microalgae, Chlorella zofingiensis. To achieve this, photoautotrophically grown Chlorella zofingiensis extracts including (glyco-)proteins were enzymatically deglycosylated and labelled with 2-aminobenzoic acid tag. Released N-glycans were purified with a HILIC-based approach
    and analyzed by MALDI-TOF(/TOF)-MS. The results showed that C. zofingiensis included oligomannosidic type N-glycan patterns. In addition, N-glycosylation profiles of C. zofingiensis by MALDI-MS revealed that most of the oligomannosidic N-glycans were phosphorylated. </p>
  abstract_tr: >-
    <p>Günümüzde, mikroalg türlerinin biyofarmasötik üretiminde hammadde olarak kullanımı konusu tartışılmaktadır. .Bu fikrin altında yatan temel neden mikro alglerin, biyolojik olarak aktif çok sayıda bileşenin üretimi için karbon dioksiti etkin bir şekilde kullanabilen hücre fabrikaları olmasıdır. Bununla birlikte, mikroalglerden rekombinant protein üretiminde kullanılması için çözülmesi gereken birkaç sorun mevcuttur. Kritik gereksinimlerden birisi salgılanan rekombinant proteinlerden biyo-uyumlu bir N-glikozilasyon profile üretmektir. Ancak mikroalg türlerinin glikozilasyon makineleri ve N-glikan profilleri hakkındaki bilgiler oldukça sınırlıdır. Bu çalışmada, yeşil bir mikroalg türü olan Chlorella zofingiensis ‘in N-glikan profilinin karakterize edilmesi amaçlandı. Bu amaçla (gliko-)proteinleri içeren fotoototrofik olarak yetiştirilmiş Chlorella zofingiensis ekstreleri enzimatik olarak deglikozile edildi ve 2-aminobenzoik asit etiketi ile etiketlendi. Serbest hale getirilen N-glikanlar
    HILIC bazlı bir yaklaşımla saflaştırıldı ve MALDI-TOF (/TOF)-MS ile analiz edildi. Sonuçlar C. zofingiensis'in oligomannozidik türde N-glikan modellerini içerdiğini göstermiştir. Ek olarak, MALDI-MS tarafından C. zofingiensis'in N-glikosilasyon profilleri, oligomannosidik N-glikanların neredeyse yarısının fosforilenmiş olduğunu ortaya koymuştur. </p>
- title: >-
    The use of montmorillonite, a natural coagulant, for the treatment of whey by coagulation/flocculation method
  citation: >-
    Özgüven, A., Bayram, T., Öztürk, D., &amp; <strong>Aladag, E.</strong> (2020). The use of montmorillonite, a natural coagulant, for the treatment of whey by coagulation/flocculation method. <em>Çukurova Üniversitesi Mühendislik-Mimarlık Fakültesi Dergisi</em>, 35(1), 59–66. (in Turkish)
  year: 2020
  type: other
  index: TR Dizin
  url: https://doi.org/10.21605/cukurovaummfd.764556
  pdf: cukurovaummfd.764556.pdf
  abstract: >-
    <p>In this study, chemical treatment of whey originating from dairy industry wastewaters by coagulation/flocculation method was aimed. The chemical treatment of whey was carried out with jar test experiments and optimum coagulant type and dosage were determined in the best pH range. Batch experiments were performed to investigate the effect of pH (4.0-8.5) and coagulant dose (0.25-2.0 g/L) on COD (chemical oxygen demand) removal efficiency. Iron sulfate, aluminum sulfate (alum) and clay (montmorillonit) were used as coagulants. Optimum dose of coagulant was 1.0 g/L and pH 7.0. For clay, alum + clay, iron sulphate + clay, 88%, 91% and 92% COD removal efficiency and 89%, 93% and 95% SS (suspended solid) removal efficiency were obtained respectively. In the chemical treatment experiments, it was concluded that montmorillionite can be used together with other coagulants for pretreatment. However, since the discharge standards specified in the water pollution control regulation could not
    be met, it was determined that chemical treatment would only relieve the load of the next unit. </p>
  abstract_tr: >-
    <p>Bu çalışmada süt endüstrisi atıksularından kaynaklanan peyniraltı suyunun koagülasyon/flokülasyon yöntemiyle kimyasal arıtımı amaçlanmıştır. Peyniraltı suyunun kimyasal arıtımı, jar testi deneyleriyle yürütülerek en iyi pH aralığında optimum koagülant cinsi ve dozu belirlenmiştir. pH (4,0-8,5) ve koagülant dozunun (0,25-2,0 g/L) KOİ (kimyasal oksijen ihtiyacı) giderim verimine etkisini incelemek üzere kesikli deneyler yapılmıştır. Koagülant olarak demir sülfat, alüminyum sülfat (alum) ve kil (montmorillonit) kullanılmıştır. Optimum koagülant dozu 1,0 g/L ve pH 7,0 olarak belirlenmiştir. Kil, alum+kil, demirsülfat+kil için sırasıyla %88, %91 ve %92 KOİ giderim verimi ve %89, %93 ve %95 AKM (askıda katı madde) giderim verimi elde edilmiştir. Yapılan kimyasal arıtma deneylerinde montmorillonitin diğer koagülantlarla birlikte ön arıtım amacıyla kullanılabileceği sonucuna varılmıştır. Ancak su kirliliği kontrol yönetmeliğinde belirtilen deşarj standartları sağlanamadığı için kimyasal arıtımın
    sadece kendinden sonraki ünitenin yükünü hafifleteceği tespit edilmiştir. </p>
- title: Characterization of slaughterhouse wastewaters and evaluation of its treatability
  citation: >-
    Öztürk, D., <strong>Aladag, E.</strong>, Yılmaz, A. E., Boncukcuoğlu, R., &amp; Bayram, T. (2019). Characterization of slaughterhouse wastewaters and evaluation of its treatability. <em>Journal of the Institute of Science and Technology (Iğdır University)</em>, 9(2), 738–748. (in Turkish)
  year: 2019
  type: other
  index: TR Dizin
  url: https://doi.org/10.21597/jist.474743
  pdf: jist.474743.pdf
  abstract: >-
    <p>In this study, wastewater of a slaughterhouse which is located in Van is characterized and treatment alternatives are evaluated. For characterization; nitrate, sulfur trioxide, phosphate, ammonium nitrogen, chloride, suspended solids (SS), total organic carbon (TOC), total carbon (TC), inorganic carbon (IC), total nitrogen (TN), electrical conductivity (EC), pH, total chemical oxygen demand (TCOD), dissolved chemical oxygen demand (DCOD) and particulate chemical oxygen demand (PCOD) parameters were investigated. According to the results; nitrate; 18.5 - 35.9 ppm, sulfur trioxide; 15.3 - 89.3 ppm, phosphate; 72.2 - 190.5 ppm, ammonium nitrogen; 20 - 38 ppm, chloride; 239.9 - 422.7 ppm, TSS; 475 - 1800 ppm, TOC; 4429 – 10 250 ppm, TC; 4535 – 10 494.6 ppm, IC; 105.7 - 244.6 ppm, TN; 800 - 1546 ppm, EC; 1.4 - 3.0 ms cm-1 , pH; 7.0 - 8.2, TCOD; 17 626 – 23 268 ppm, DCOD; 13 658 – 18 029 ppm and PCOD; 3968 - 5239 ppm were found. At the same time, anaerobic, aerobic, advanced oxidation,
    dissolved air flotation, membrane filtration and electrochemical treatment processes are investigated for slaughterhouse wastewater which is proposed in literature. Due to the multiple composition (pharmaceuticals, organic matter, toxic substances, etc.) of the wastewater, it was observed that the single treatment processes did not provide sufficient treatment and it was concluded that more effective treatment was performed with the combined processes. </p>
  abstract_tr: >-
    <p>Bu çalışmada Van ilinde bulunan bir mezbahane tesisine ait atıksuyun karakterizasyonu yapılarak bu atıksu için arıtım alternatifleri değerlendirilmiştir. Atıksu karakterizasyonu için nitrat, kükürt trioksit, fosfat, amonyum azotu, klorür, askıda katı madde (AKM), toplam organik karbon (TOK), toplam karbon (TK), inorganik karbon (İK), toplam azot (TN), elektriksel iletkenlik (Eİ), pH, toplam kimyasal oksijen ihtiyacı (TKOİ), çözünmüĢ kimyasal oksijen ihtiyacı (ÇKOİ) ve partiküler kimyasal oksijen ihtiyacı (PKOİ) parametreleri incelenmiştir. Sonuçlar; nitrat; 18.5 - 35.9 ppm, kükürt trioksit; 15.3 - 89.3 ppm, fosfat; 72.2 - 190.5 ppm, amonyum azotu; 20 - 38 ppm, klorür; 239.9 - 422.7 ppm, AKM; 475 - 1800 ppm, TOK; 4429 - 10250 ppm, TK; 4535 – 10 494.6 ppm, İK; 105.7 - 244.6 ppm, TN; 800 - 1546 ppm, Eİ; 1.4 - 3.0 ms cm-1, pH; 7.0 - 8.2, TKOİ; 17 626 – 23 268 ppm, ÇKOİ; 13 658 – 18 029 ppm ve PKOİ; 3968 - 5239 ppm olarak bulunmuştur. Aynı zamanda mezbahane atıksuları için literatürde
    önerilen anaerobik, aerobik, ileri oksidasyon, çözünmüş hava flotasyonu, membran filtrasyonu, elektrokimyasal arıtım prosesleri incelenmiştir. Atıksuyun çoklu (farmasötikler, organik madde, toksik madde vb.) kompozisyonu sebebiyle tekli arıtım proseslerinin yeterli arıtımı sağlamadığı gözlenmiş ve kombine proseslerle daha etkili arıtım yapıldığı sonucuna ulaşılmıştır. </p>
