- title: The influence of meteorological factors on air quality in the province of Van, Turkey
  citation: >-
    <strong>Aladag, E.</strong> (2023). The influence of meteorological factors on air quality in the province of Van, Turkey. <em>Water, Air, &amp; Soil Pollution</em>, 234(4), 259.
  year: 2023
  type: sci
  index: SCI-E
  url: https://doi.org/10.1007/s11270-023-06265-0
  pdf: s11270-023-06265-0.pdf
  abstract: >-
    <p>Van, the most crowded province in the east of Turkey, is afflicted by intense air pollution especially in winter. Permanence and transport of air pollutants are closely associated with the region’s meteorological features. Hourly and annual variations in PM<sub>10</sub> and SO<sub>2</sub> air pollutants and temperature, wind, pressure, and humidity atmospheric variables were investigated in Van city center for 2015–2020. A multiple non-linear regression (MLNR) model was used to research the effect of meteorological parameters on air quality. Stepwise and best-subset statistical methods were applied to optimize estimators in the MNLR model. In the winter months, increases above limit values were observed for PM<sub>10</sub> and SO<sub>2</sub> linked to increases in low-quality fuel consumption due to reducing temperatures in the evenings. Spearman analysis showed there were moderate inverse correlations with temperature (R<sup>2</sup> = -0.42) and wind speed (R<sup>2</sup> = -0.42)
    and weak positive correlations with pressure (R<sup>2</sup> = 0.35) and humidity (R<sup>2</sup> = 0.22) for the air quality index. The MNLR model using minimum temperature (T<sub>min</sub>), average wind speed (W<sub>s</sub>), the maximum pressure (P<sub>max</sub>), and average humidity (H<sub>avg</sub>) was the most successful (R = 0.53, RMSE = 0.24) air quality model. The reduction in air quality was associated with colder temperatures, lower wind speed, higher atmospheric pressure and higher humidity. In conclusion, policymakers and implementors should pay attention to local climate features to effectively minimize urban air pollution.</p>
