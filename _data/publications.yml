- title: >-
    Long-term particulate matter pollution dynamics near the Afşin–Elbistan lignite-fired thermal power plant complex: An integrated AQI–ITA trend assessment
  citation: >-
    <strong>Aladag, E.</strong> (2026). Long-term particulate matter pollution dynamics near the Afşin–Elbistan lignite-fired thermal power plant complex: An integrated AQI–ITA trend assessment. <em>Bulletin of Environmental Contamination and Toxicology</em>, 116(6), 1–9.
  year: 2026
  type: sci
  index: SCI-E
  url: https://doi.org/10.1007/s00128-026-04272-5
  pdf: s00128-026-04272-5.pdf
  abstract: >-
    <p>The present study investigates the characteristics of long-term PM<sub>10</sub> pollution in the proximity of Afşin-Elbistan lignite-fired thermal power plant complex, one of Türkiye’s largest coal-based energy production regions. Daily measurements obtained from the Elbistan monitoring station are analyzed from 2011 to 2024 using descriptive statistics, exceedance analysis for annual and monthly data, and Air Quality Index-Integrated Innovative Trend Analysis (AQI-ITA). The obtained results show that the annual average PM<sub>10</sub> concentration values exceed the national limit for the whole period and are several-fold higher than the WHO guideline value. In addition, the lowest annual averages are recorded in 2020 and 2022, while the highest annual averages are found in 2017 and 2018. For some years, the number of days when the daily limit is exceeded approaches the total number of days in the year. High PM<sub>10</sub> concentration values are registered in winter months due
    to emissions related to lignite combustion and residential heating. According to AQI-ITA results, the trendless behavior dominates the process under analysis at low and moderate concentration values, while increasing trends occur at high pollution values in winter and autumn. Overall, PM<sub>10</sub> pollution in Elbistan can be considered persistent during the entire period under consideration and may be influenced by the nearby energy production complex, residential heating activities, and various environmental factors. Therefore, further improvements in air quality management policies are also expected to contribute to more effective pollution control in the region.</p>
