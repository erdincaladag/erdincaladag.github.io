- title: >-
    Modeling the light-dependent growth kinetics of the green microalga <i>Chlorella zofingiensis</i>
  citation: >-
    <strong>Aladag, E.</strong> (2024). Modeling the light-dependent growth kinetics of the green microalga Chlorella zofingiensis. <em>4th Global Conference on Engineering Research</em>, Balıkesir, Türkiye, 16–19 October 2024, pp. 199–206.
  year: 2024
  index: Full text
  abstract: >-
    <p>Microalgae are photosynthetic microorganisms used as feedstock in many fields, from biofuels to food sources. In this research, <i>Chlorella zofingiensis</i>, a green microalgae species that is widely cultivated due to its ability to obtain a variety of products and its applicability in various industrial sectors, was used. Microalgae biomass productivity is affected by many environmental factors such as temperature, light, salinity and nutrient composition. Light intensity plays a key role in microalgae cultivation under autotrophic conditions. The relationship between light intensity and growth rate was investigated using Monod and Haldane kinetic models. The specific growth rates of microalgae cultivated at different light intensities of 25, 50, 100, 250 and 500 μmol photon m⁻² s⁻¹ were calculated as 0.25, 0.31, 0.35, 0.34 and 0.33 d⁻¹, respectively. When the light intensity was increased from 25 to 100 μmol photon m⁻² s⁻¹, the specific growth rate increased by 40%. The kinetic
    constants of the Monod equation μ<sub>max</sub> and K<sub>I</sub> were found as 0.36 d⁻¹ and 10.70 μmol photon m⁻² s⁻¹, respectively. The kinetic constants of the Haldane equation μ<sub>max</sub>, K<sub>I</sub> and K<sub>i</sub> were found to be 0.42 d⁻¹, 17.11 μmol photon m⁻² s⁻¹ and 1991.26 μmol photon m⁻² s⁻¹, respectively. RMSE and R² were calculated to determine the goodness of fit of the Monod and Haldane models with experimental data. RMSE values were found to be 0.018 and 0.006 and R² values were found to be 0.82 and 0.98, respectively. According to both performance criteria, it can be said that the Haldane model explains the light-dependent microalgal growth better. Mathematical models can be used to predict microalgal growth and optimize operational parameters. These useful tools minimize the necessity for labor-intensive and expensive experiments.</p>
- title: >-
    The determination of the equilibrium isotherm model of heavy metal adsorption using montmorillonite clay
  citation: >-
    <strong>Aladag, E.</strong>, &amp; Ünal, E. (2023). The determination of the equilibrium isotherm model of heavy metal adsorption using montmorillonite clay. <em>4th International Turkish World Engineering and Science Congress</em>, Antalya, Türkiye, 30 November – 3 December 2023, pp. 240–241.
  year: 2023
  index: Abstract
  abstract: >-
    <p>The Determination of the Equilibrium Isotherm Model of Heavy Metal Adsorption Using Montmorillonite Clay: process has long been recognized as a highly efficient approach for pollution control. Many different adsorbents are utilized for the removal of various pollutants such as heavy metals, dyes and other toxic compounds from wastewater. Clay minerals are widely preferred for the remediation of contaminated wastewater due to their well-known adsorption capabilities. Natural montmorillonite clay mineral is a frequently preferred adsorbent due to its high adsorption capacity, abundant availability in nature and low cost. In this study, montmorillonite from Narman district of Erzurum province in eastern Turkey was used as adsorbent. Adsorption experiments were carried out batch at constant temperature of 25 °C, natural pH, 150 rpm agitation speed. Aqueous solutions containing initial Cr(VI) metal ions in the concentration range of 2-100 mg/L were taken 100 mL and transferred to 250 mL
    volume flasks. Then adsorbents weighing 0.3 g were added to the flasks and the experiment was started. At the end of the 60 min experiment, the Cr(VI) concentrations in the aqueous solutions that reached equilibrium were determined. Two-parameter Langmuir, Freundlich, Temkin and three-parameter Sips, Toth, Khan isotherm models were investigated to determine the suitable isotherm model. The lowest sum of squared errors (SSE) and the highest coefficient of determination (R<sup>2</sup>) were obtained as 1.203 and 0.994 for Langmuir isotherm model in two-parameter equations and 0.294 and 0.998 for Sips isotherm model in three-parameter equations, respectively. Langmuir isotherm coefficients Q<sub>m</sub> and K were calculated as 9.431 mg/g and 0.581, respectively. Sips isotherm coefficients Q<sub>m</sub>, K and n were calculated as 10.128 mg/g, 0.593 and 0.760, respectively. The obtained results indicate that natural montmorillonite clay is suitable to be used as adsorbent for the removal
    of Cr(VI) metal ion from aqueous media. In future studies, it is recommended to determine the optimum adsorption conditions by applying various optimization methodologies.</p>
- title: >-
    Design of a novel bubble column photobioreactor and circular illumination system for microalgae cultivation
  citation: >-
    <strong>Aladag, E.</strong>, Onay, M., &amp; Nuhoğlu, A. (2023). Design of a novel bubble column photobioreactor and circular illumination system for microalgae cultivation. <em>3rd Global Conference on Engineering Research</em>, Balıkesir, Türkiye, 13–16 September 2023, pp. 251–258.
  year: 2023
  index: Full text
  abstract: >-
    <p>Microalgae are promising potential feedstock candidates for many fields, including the pharmaceutical industry, food products and bioenergy. Especially recently, they have attracted more attention in biorefinery applications due to their relatively small land requirements, rapid growth and high valuable content. Microalgae are also very capable in environmental biotechnology applications such as carbon dioxide capture and advanced wastewater treatment. Light is among the most important environmental factors affecting biomass quality and photosynthetic efficiency in microalgae cultivation. The design of the light source and photobioreactor plays a key role in this process. In this study, a novel bubble column photobioreactor and a circularly illuminated LED-jacket were designed to enhance microalgal biomass production. The photobioreactor, which is aerated along its entire bottom, aims to prevent the formation of biofilm especially on the reactor wall and to reach the inner parts of
    the reactor, and the LED-jacket system with circular illumination aims to provide a more homogeneous light distribution by providing equal amount and equal angle of light to the outer surface of the reactor. As a result of the experiments conducted with the designed system in BBM medium at different light intensities using <i>Chlorella zofingiensis</i>, the highest biomass productivity and specific growth rate were obtained as 56 mg/L·day and 0.18 day<sup>-1</sup> at 175 µmol/m<sup>2</sup>·s light intensity, respectively. It was found that biomass productivity increased up to 67% depending on the light intensity. The findings reveal that sustainable microalgal biomass production can be achieved with the innovative photobioreactor with whole bottom aeration and circular lighting system.</p>
- title: Bioremediation of pharmaceuticals from contaminated water by microalgae culture
  citation: >-
    Yaman, M. E., &amp; <strong>Aladag, E.</strong> (2022). Bioremediation of pharmaceuticals from contaminated water by microalgae culture. <em>4th International Environmental Chemistry Congress</em>, Antalya, Türkiye, 30 October – 2 November 2022, p. 69.
  year: 2022
  index: Oral · Abstract
  abstract: >-
    <p>The demand for pharmacological products is increasing day by day with the remaining importance given to the treatment of diseases and human health. These pharmaceuticals and their metabolites, which are released into the environment with the domestic, hospital, and pharmaceutical industry wastewater, pose a serious threat to the aquatic ecosystem and public health.<sup>1</sup> Even if high-efficiency wastewater treatment is accomplished with conventional wastewater treatment technologies, the total removal of organic micropollutants cannot be achieved.<sup>2</sup> Microalgae are known to have an important role in the removal of pharmaceutical compounds from wastewater.<sup>3</sup> <br/>In this study, the removal of paracetamol and diclofenac pharmaceuticals under photoautotrophic conditions using <i>Scenedesmus sp.</i> was investigated. The microalgae strain was illuminated for 12 hours per day with a light intensity of 100 µmol-photon/m<sup>2</sup>·s at 25 ± 1 °C. At the end of the
    8-day experiment period, 69% and 91% removal efficiencies were obtained for paracetamol and diclofenac, respectively. These results show that <i>Scenedesmus sp.</i> is a suitable microalgae species for bioremediation of wastewater containing paracetamol and diclofenac.</p> References:<br/> 1) Chandel, N., Ahuja, V., Gurav, R., Kumar, V., Tyagi, V. K., Pugazhendhi, A., ... &amp; Bhatia, S. K. (2022). Progress in microalgal mediated bioremediation systems for the removal of antibiotics and pharmaceuticals from wastewater. Science of The Total Environment, 825, 153895.<br/> 2) Encarnação, T., Palito, C., Pais, A. A., Valente, A. J., &amp; Burrows, H. D. (2020). Removal of pharmaceuticals from water by free and imobilised microalgae. Molecules, 25(16), 3639.<br/> 3) Liu, R., Li, S., Tu, Y., &amp; Hao, X. (2021). Capabilities and mechanisms of microalgae on removing micropollutants from wastewater: A review. Journal of Environmental Management, 285, 112149.
- title: Biosorption of heavy metals by microalgae
  citation: >-
    <strong>Aladag, E.</strong> (2022). Biosorption of heavy metals by microalgae. <em>2nd International Conference on Engineering and Applied Natural Sciences</em>, Konya, Türkiye, 15–18 October 2022, p. 76.
  year: 2022
  index: Oral · Abstract
  abstract: >-
    <p>Large amounts of wastewater containing heavy metals are produced by anthropogenic activities. The discharge of toxic metal-rich wastewater into the receiving environment without treatment poses a serious threat to living organisms in the ecosystem and public health. Nowadays, many advanced treatment methods are applied for the treatment of this type of wastewater. Microalgae are biomaterials with sustainable potential in the removal of toxic and harmful substances in wastewater. In addition to biodegradation and bioaccumulation processes, significant heavy metals are removed from wastewater by biosorption by microalgae. The functional groups that bind metal ions in the cell wall of microalgae make them important biosorbents in heavy metal biosorption. Heavy metals are removed from wastewater by microalgae through active and passive biosorption. The active biosorption process that occurs in living cells is more sensitive to medium conditions than passive biosorption, takes place more
    slowly, and has lower metal uptake. Biosorption efficiency is affected by many conditions such as microalgae strain and biosorbent amount, wastewater type, heavy metal ions and concentration, contact time, mixing, pH, and temperature of the solution. Despite its high heavy metal sorption capacity, microalgal biosorption has difficulties such as free suspension of microalgae, small particle size, low chemical resistance, low mechanical strength, and separation from treated wastewater. In future studies, overcoming these difficulties can realize a cost-effective and sustainable microalgal biosorption process.</p>
- title: >-
    Determination of thermodynamic parameters in the adsorption of cationic dye onto montmorillonite
  citation: >-
    <strong>Aladag, E.</strong> (2022). Determination of thermodynamic parameters in the adsorption of cationic dye onto montmorillonite. <em>1st International Conference on Innovative Academic Studies</em>, Konya, Türkiye, 10–13 September 2022, p. 109.
  year: 2022
  index: Oral · Abstract
  abstract: >-
    <p>A wide variety of dyestuffs are used in industries such as textiles, cosmetics, paper, leather, pharmaceuticals and food. The presence of these colored and synthetic wastes in the aquatic environment, even in very small quantities, adversely affects the aquatic ecosystem and causes toxic effects. Discharge of dyestuffs without removing them from wastewater reduces the amount of dissolved oxygen in the receiving environment and contributes to the high chemical oxidation demand. It is also a serious threat to public health: overexposure to the dye causes skin irritation, respiratory problems and increases the risk of cancer. Therefore, effective treatment of dye-containing wastewater is of great importance in order to ensure safe discharge. <br/>In this study, the adsorption of crystal violet cationic dye, which is widely used in many industries, from aqueous solutions onto montmorillonite, a natural clay, was investigated. The experiments were carried out at an initial dye concentration
    of 100 mg/L, an adsorbent dosage of 0.1 g/100 mL, a pH of 6.2 (natural) and a shaking speed of 100 rpm for 60 minutes. In batch adsorption studies at 20, 30, 40, 50 and 60 °C, removal efficiencies of 84.07%, 84.88%, 85.90%, 86.57% and 87.06% were obtained, respectively. It was found that the experimental data fit the pseudo-second-order reaction kinetics (R<sup>2</sup> = 0.99). The activation energy was found to be 12.12 kJ/mol. The relatively low activation energy indicates that physical adsorption has occurred. The thermodynamic parameters ΔH° and ΔS° were calculated as 9.52 kJ/mol and -237.02 J/mol K, respectively. A positive ΔH° value indicates that the adsorption reaction is endothermic. Negative activation entropy reveals a lower tendency towards randomness at the solid/solution interface. ΔG° increases from 79.00 kJ/mol to 88.48 kJ/mol depending on the temperature. The findings show that the adsorption of montmorillonite and crystal violet is favorable with the increase in temperature.</p>
- title: Trend analysis of particulate matter pollution in Iğdır province
  citation: >-
    <strong>Aladag, E.</strong> (2022). Trend analysis of particulate matter pollution in Iğdır province. <em>3rd International Conference on Applied Engineering and Natural Sciences</em>, Konya, Türkiye, 20–23 July 2022, pp. 2484–2489. (in Turkish)
  year: 2022
  index: Oral · Full text
  abstract: >-
    <p>Particulate matter that enters with the bloodstream through respiration and can reach deep into the lung tissue; It is among the important atmospheric pollutants in terms of public health. High particulate matter pollution is responsible for at least 4.1 million deaths worldwide each year. Also in Turkey, it is associated with premature birth, cardiovascular diseases and many respiratory diseases. The province of Iğdır, chosen as the study area, is home to the most polluted city center in our country. In this study, monthly, annual averages and trends of PM<sub>10</sub> concentration measured in the city center of Iğdır between the years 2008-2021 were examined. The highest average PM<sub>10</sub> amount was measured in January (222.30 µg/m<sup>3</sup>), December (222.30 µg/m<sup>3</sup>), November and February (183.52 µg/m<sup>3</sup>), respectively. In addition, measurements were made above the annual guide value (15 µg/m<sup>3</sup>) recommended by WHO (World Health Organization)
    and the limit value (40 µg/m<sup>3</sup>) determined by the Air Quality Assessment and Management Regulation (HKDYY) in all years. In order to determine the trends, two different trend analysis methods, namely Mann-Kendall and Sen's slope tests, were applied. According to the results, no decrease was detected in the amount of particulate matter on a monthly and annual basis. Despite that; respectively, in October (4.16 µg/m<sup>3</sup>·year), September (2.67 µg/m<sup>3</sup>·year), June (2.28 µg/m<sup>3</sup>·year) and May (1.41 µg/m<sup>3</sup>·year) significant increasing trends were determined. The findings reveal that the air pollution measures in the city center of Iğdır are insufficient. It is recommended that more effective measures be taken by legislators and local governments so that more people are not adversely affected by environmental problems that may be caused by particulate matter pollution in the future.</p>
- title: N-glycosylation profile of the green microalgae <i>Chlorella zofingiensis</i>
  citation: >-
    Yaman, M. E., <strong>Aladag, E.</strong>, Kayılı, H. M., Kadıoğlu, Y., &amp; Salih, B. (2019). N-glycosylation profile of the green microalgae Chlorella zofingiensis. <em>2nd International Environmental Chemistry Congress</em>, Antalya, Türkiye, 31 October – 3 November 2019, p. 68.
  year: 2019
  index: Abstract
  abstract: >-
    <p>To date, the use of microalgae species as raw materials in biopharmaceutical production is on the agenda.<sup>1</sup> The reason behind this idea is that microalgae are cell factories that are able to efficiently utilize carbon dioxide for the production of numerous biologically active compounds. However, there are several problems that remain to be solved in the production of recombinant protein from microalgaes. One of the critual need is a biyo-compatible N-glycosylation patterns from the secreted recombinant proteins. N-glycosylation is the most common post-translational modification of mammalian proteins. There are many important functional roles of N-glycosylation such as contribute to protein folding by steric effects. Within the immune system, the N-glycans on an immune cell’s surface will help dictate that migration pattern of the cell. Therefore, it’s expected that the biopharmaceutical proteins to have no foreign N-glycan pattern to human cells.<sup>2</sup></p>

    <p><i>Chlorella zofingiensis</i> that is a fresh water green microalgae, may be a suitable candidate to become a biopharmaceutical raw material manufacturer. It grows fast, is easy to be cultured and scaled up both indoors and outdoors, and achieves ultrahigh cell density.<sup>3</sup> There was no study in which a comprehensive N-glycosylation profile was obtained for the <i>Chlorella zofingiensis</i> in our knowledge.</p>

    <p><i>Chlorella zofingiensis</i> was grown photoautotrophically (photon flux: 175 μmol·m<sup>-2</sup>·s<sup>-1</sup>) in TAP medium. Microalgae extract proteins were reconstituted and denaturated. PNGase F enzyme were used to release N-glycans from the proteins. Subsequently, the samples were centrifuged and supernatants were collected. Released N-glycans were labelled with 2-aminobenzoic acid and a HILIC based method used for purification and enrichment. MALDI-TOF(/TOF)-MS analysis.of labelled N-glycans were performed at negative reflectron mode All spectra were obtainedin the positive and reflectron mode using a random walk pattern in the mass range of 1000–4000 Da. DHB (5 mg/mL prepared in 50% ACN) was used as a MALDI matrix. Results indicate that N-glycan profile of <i>C. zonfingensis</i> contains predominantly high mannoz type of N-glycans.</p>
- title: >-
    Investigation of the adsorption equilibrium mechanism of Auramine-O dye with bottom sludge obtained from the Damar waste dam
  citation: >-
    Dişli, E., Öztürk, D., &amp; <strong>Aladag, E.</strong> (2019). Investigation of the adsorption equilibrium mechanism of Auramine-O dye with bottom sludge obtained from the Damar waste dam. <em>2nd International Turkish World Engineering and Science Congress</em>, Antalya, Türkiye, 7–10 November 2019, pp. 540–547. (in Turkish)
  year: 2019
  index: Oral · Full text
  abstract: >-
    <p>Industrial wastewaters have a very complex characterization. Depending on the type of industry and the product produced, many special pollutants emerge. Dyes are widely used in many industries such as paint, paper, textile, food, leather and cosmetics, producing colored products. Most of the colorants in the contents of colored wastewater, do not undergo biodegradation in receiving environments. Therefore, even very small concentrations of dyestuffs disrupt the natural structure of the receiving media. Adsorption is one of the most suitable methods for the removal of cationic dyes. In equilibrium studies in which the removal of Auramine-O as a cationic dye onto bottom sludge obtaıned from the Damar Waste Dam, was investigated, the results were applied to the Langmuir, Freundlich and Dubinin Radushchevich isotherms. According to the results, 0.9981 correlation coefficient (R<sup>2</sup>) showed that adsorption was best matched to Langmuir isotherm. The E value calculated from Dubinin-Radushkevich
    isotherm equation is calculated as 0.13 kJ/mol. According to this information, the mechanism of adsorption can be physical. It can also be said that the bottom sludge is suitable and usable for the removal of cationic dyes from the textile industry wastewater. In addition, the fact that the bottom sludge is a waste adsorbent, is suitable for the use of waste back to the final removal of the waste from the dam, and does not require expenditure in the economic sense indicates the importance of this adsorbent. We believe that this study will shed light on many future researches.</p>
- title: Adsorption of uranium-238 with dasit stone in column system
  citation: >-
    Türközü, D. A., Dişli, E., Selçuk Zorer, Ö., <strong>Aladag, E.</strong>, &amp; Öztürk, D. (2019). Adsorption of uranium-238 with dasit stone in column system. <em>8th International Symposium on In Situ Nuclear Metrology as a Tool for Radioecology</em>, Aydın, Türkiye, 23–26 April 2019, p. 52.
  year: 2019
  index: Oral · Abstract
  abstract: >-
    <p>Due to mining activities and increasing energy demand, the amount of uranium released into the nature is rising day by day owing to the increasing number of nuclear power plants. The search for economic and effective removal for the Uranium-238 occupies the agenda of scientists because it negatively affects the health of human and natural habitats and leads to ecotoxicological risks. Adsorption is a eco-friendly process which eliminate the use of chemicals. Adsorbent is a main actor on adsorption process so it should have high adsorption capacity, reusable, economic and abundant in nature. Dasit is a type of volcanic frozen rock that has an aphanitic texture to porphyritic and has an intermediate composition between andesite and rhyolite. In this study aims to investigate the adsorption of Uranium-238 from aqueous solutions with column system. Dasit stone (collected from Meydan Volcaino in Van) which has 250 mesh particle size was filled to column. Prepared Uranium-238 solution was
    feed to column with a peristaltic pump at fixed flow rate (25 mL/min). Under optimum operational conditions maximum removal yield was observed as 84%. In the light of the experimental data obtained, it can be said that Dasit has a certain potential in the removal of Uranium-238.</p>
- title: Examination of removal of <sup>238</sup>U with diatomite in continuous flow system
  citation: >-
    Türközü, D. A., Dişli, E., Öztürk, D., Selçuk Zorer, Ö., &amp; <strong>Aladag, E.</strong> (2019). Examination of removal of 238U with diatomite in continuous flow system. <em>8th International Symposium on In Situ Nuclear Metrology as a Tool for Radioecology</em>, Aydın, Türkiye, 23–26 April 2019, p. 51.
  year: 2019
  index: Oral · Abstract
  abstract: >-
    <p><sup>238</sup>U is the most common isotope of uranium found in nature, with a relative abundance of 99%. Generally, the highest potential radiation-related health risk for uranium mining or processing facility workers is lung cancer associated with inhaling uranium decay products. One of the most suitable methods for the removal of <sup>238</sup>U is adsorption. So it is important in adsorption procedure to use low-cost and highly efficient adsorbents. While in a laboratory-scale study a small amount of adsorbent material is used, on industrial scale it will use tons of adsorbent. For this reason, adsorbent must be abundant in nature and cost efficient. Diatomite is a naturally occurring, soft, siliceous sedimentary rock that is easily crumbled into a fine white to off-white powder. With this research the adsorption of <sup>238</sup>U ions on Diatomite collected from the deposits located at the Kahramankazan in Ankara in Turkey was investigated in continuous coloumn system. Column’s
    height is 40 mm and radius is 25 mm. Feeding solution flow rate was selected as 25 mL/min. Under optimum operational conditions maximum adsorption yield was observed as 94%. The results suggest that Diatomite can be used as efficient and cost effective adsorbent for <sup>238</sup>U removal.</p>
- title: An evaluation of solid waste management in Erzincan province
  citation: >-
    Bayram, T., Öztürk, D., <strong>Aladag, E.</strong>, Erkuş, A., &amp; Erkuş, F. Ş. (2017). An evaluation of solid waste management in Erzincan province. <em>3rd International Conference on Engineering and Natural Sciences</em>, Budapest, Hungary, 3–7 May 2017, p. 46.
  year: 2017
  index: Oral · Abstract
  abstract: >-
    <p>Waste composition has changed, and the amounts of waste have increased every passing day with technological advances, urbanization, industrialization, improvement of life standards and rapid population growth. The components of waste in Turkey are 68% organic waste, 13% recyclable solid waste and 19% other waste. Solid waste management eliminates or minimizes the adverse impacts on the environment and human health, and provides economic development and improved living conditions/quality. In Turkey, which targeted the industrial development, because it had the priority for production in 1970s and 1980s, there was a great and speedy increase in industrial solid waste materials in the parallel of production amount and diversity. Although the attempts of the construction and operation of regular depositing areas are being performed, they are considerably low. For the solution of the solid effluent problem in our country by Environment and Forest Ministry, it is seen as the main issue
    that operating the “Solid Effluent Removing Facilities" is of the key role in preservation of the environment and hindering the pollution from domestic uses. Although Erzincan province has many natural beauties, there is a sanitary landfill only in its central district. In district municipalities, solid wastes are collected in hazardous waste storage areas. The leachate produced by the solid waste landfill is collected and then discharged to the receiving environment after being purified in the Erzincan Municipality waste water treatment plant located next to the facility. This study will evaluate practices, problems and solution offers in the solid waste management adaptation and development processes.</p>
