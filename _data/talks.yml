- title: Adsorption of Basic Yellow 2 from aqueous solutions onto Montmorillonite
  citation: >-
    Sözüdoğru, O., Fil, B. A., Boncukcuoğlu, R., <strong>Aladag, E.</strong>, &amp; Kul, S. (2015). Adsorption of Basic Yellow 2 from aqueous solutions onto Montmorillonite. <em>International Conference on Civil and Environmental Engineering</em>, Nevşehir, Türkiye, 20–23 May 2015, p. 132.
  year: 2015
  index: Abstract
  abstract: >-
    <p>The removal of Basic Yellow 2 (BY2), a cationic dye, from aqueous solution by using montmorillonite as adsorbent was studied in batch experiments. Basic Yellow 2 (BY2) is generally used in textile mills, paper mills, leather and carpet production. Basic Yellow 2 (BY2), Auramine, (4,4’-dimethylaminobenzophenonimide), and its hydrochloride salt are used in the coloring of paper, textiles and leather; and also as food dye. The effect of agitation speed, adsorbent dosage and initial dye concentration on the removal of BY2 was also investigated. Langmuir, Freundlich and Temkin isotherms were applied to fit the adsorption data of BY2 dye. Equilibrium data were well described by the typical Langmuir adsorption isotherm. The maximum monolayer adsorption capacity was calculated as 434.196 mg·g<sup>-1</sup> from the Langmuir isotherm model. The adsorption data was fitted to both the pseudo-first-order, pseudo-second-order, Elovich and intra-particle kinetic models and calculated values of amount
    adsorbed at equilibrium (<i>q<sub>e</sub></i>) by pseudo-second-order equations were found to be in good agreement with the experimental values.</p>
