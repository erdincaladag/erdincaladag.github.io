name: Update research metrics

on:
  schedule:
    - cron: "17 3 * * 1"     # every Monday 03:17 UTC
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch metrics from OpenAlex
        run: python .github/scripts/update_metrics.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/metrics.yml; then echo "No change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/metrics.yml
          git commit -m "Update research metrics"
          git push
