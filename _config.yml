# Site settings ---------------------------------------------------------------
# After changing this file, restart `jekyll serve` (it is not reloaded automatically).
locale      : en-US
lang        : en
title       : "Erdinç Aladağ"
description : "Personal academic website of Erdinç Aladağ, PhD — environmental engineer at Van Yüzüncü Yıl University."
url         : "https://erdincaladag.github.io"
baseurl     : ""
timezone    : Europe/Istanbul

# Author / profile (used in the sidebar, SEO tags and footer) -----------------
author:
  name        : "Erdinç Aladağ"
  degree      : "PhD"
  title       : "Environmental Engineer"
  department  : "Department of Environmental Engineering"
  institution : "Van Yüzüncü Yıl University"
  institution_url: "https://avesis.yyu.edu.tr/erdinc"
  location    : "Van, Türkiye"
  avatar      : "/images/profile.png"
  email       : "erdincaladag@gmail.com"
  email_institutional: "erdinc@yyu.edu.tr"
  googlescholar: "https://scholar.google.com.tr/scholar?hl=tr&as_sdt=0%2C5&q=erdinc+aladag"   # TODO: replace with profile URL
  orcid       : "0000-0003-1354-0930"
  researchgate: "https://www.researchgate.net/profile/erdinc-aladag"
  x           : "erdincaladag"
  avesis      : "https://avesis.yyu.edu.tr/erdinc"

# Used by jekyll-seo-tag
social:
  name: "Erdinç Aladağ"
  links:
    - "https://orcid.org/0000-0003-1354-0930"
    - "https://www.researchgate.net/profile/erdinc-aladag"
    - "https://x.com/erdincaladag"
twitter:
  username: erdincaladag

# Build -----------------------------------------------------------------------
markdown    : kramdown
highlighter : rouge
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor
  - .github
  - tools

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      sidebar: true
