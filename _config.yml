# Site settings ---------------------------------------------------------------
# After changing this file, restart `jekyll serve` (it is not reloaded automatically).
locale      : en-US
lang        : en
title       : "Erdinç Aladağ"
description : "Personal academic website of Assoc. Prof. Dr. Erdinç Aladağ — Department of Environmental Engineering, Van Yüzüncü Yıl University."
url         : "https://erdincaladag.github.io"
baseurl     : ""
timezone    : Europe/Istanbul

# Author / profile (used in the sidebar, SEO tags and footer) -----------------
author:
  name        : "Erdinç Aladağ"
  prefix      : "Assoc. Prof. Dr."
  title       : "Associate Professor of Environmental Engineering"
  department  : "Department of Environmental Engineering"
  institution : "Van Yüzüncü Yıl University"
  institution_url: "https://www.yyu.edu.tr"
  location    : "Van, Türkiye"
  phone       : "+90 432 225 1701 (ext. 28272)"
  office      : "Block E, Faculty of Engineering"
  avatar      : "/images/profile.png"
  email       : "erdinc@yyu.edu.tr"
  email_personal: "erdincaladag@gmail.com"
  orcid       : "0000-0003-1354-0930"
  researchgate: "https://www.researchgate.net/profile/erdinc-aladag"
  x           : "erdincaladag"
  avesis      : "https://avesis.yyu.edu.tr/erdinc"

# Used by jekyll-seo-tag
social:
  name: "Erdinç Aladağ"
  links:
    - "https://orcid.org/0000-0003-1354-0930"
    - "https://www.researchgate.net/profile/erdinc-aladag"
    - "https://x.com/erdincaladag"
    - "https://avesis.yyu.edu.tr/erdinc"
twitter:
  username: erdincaladag

# Build -----------------------------------------------------------------------
markdown    : kramdown
highlighter : rouge
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor
  - .github
  - tools

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# "Notes": figures, code and short write-ups (Jekyll posts in _posts/)
permalink: /notes/:year/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      sidebar: false
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      sidebar: true
